<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="nutriBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1826"/>
      <stop offset="50%" stop-color="#0f2942"/>
      <stop offset="100%" stop-color="#07131e"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#nutriBg)"/>

  <!-- Background Orbs -->
  <circle cx="200" cy="200" r="180" fill="#f59e0b" opacity="0.08"/>
  <circle cx="650" cy="500" r="220" fill="#10b981" opacity="0.08"/>

  <!-- Badge -->
  <rect x="60" y="50" width="180" height="36" rx="18" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="150" y="74" fill="#fbbf24" font-family="'Cairo', sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    CLINICAL NUTRITION • تغذية
  </text>
  <text x="740" y="75" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="14" font-weight="600" text-anchor="end">
    خطة علاجية مخصصة
  </text>

  <!-- Central Graphic: Metabolic Balance Iconography -->
  <g transform="translate(400, 330)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#warmGrad)" stroke-width="3" stroke-dasharray="14 8"/>
    <circle cx="0" cy="0" r="115" fill="rgba(255,255,255,0.03)"/>

    <!-- Stylized Leaf & DNA Vitality Helix -->
    <path d="M0,70 C-50,40 -60,-40 0,-70 C60,-40 50,40 0,70 Z" fill="none" stroke="#10b981" stroke-width="3"/>
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="24" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="12" fill="#ffffff"/>

    <!-- Small orbiting metric bubbles -->
    <circle cx="-80" cy="-40" r="18" fill="#1e293b" stroke="#10b981"/>
    <text x="-80" y="-35" fill="#34d399" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" text-anchor="middle">BMI</text>
    <circle cx="80" cy="40" r="18" fill="#1e293b" stroke="#f59e0b"/>
    <text x="80" y="45" fill="#fbbf24" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Kcal</text>
  </g>

  <!-- Main Headline -->
  <text x="400" y="560" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="42" font-weight="800" text-anchor="middle">
    خطة التغذية العلاجية ونحت القوام
  </text>
  <text x="400" y="610" fill="#fbbf24" font-family="'Cairo', sans-serif" font-size="22" font-weight="600" text-anchor="middle">
    برامج علمية مخصصة بدون حرمان لصحة مستدامة
  </text>

  <!-- Badges -->
  <g transform="translate(400, 680)">
    <rect x="-240" y="-22" width="480" height="44" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(245,158,11,0.3)"/>
    <text x="0" y="7" fill="#fef3c7" font-family="'Cairo', sans-serif" font-size="16" font-weight="600" text-anchor="middle">
      قياس كتلة الجسم InBody • متابعة دورية • نظام مدروس
    </text>
  </g>

  <text x="400" y="760" fill="#64748b" font-family="'Cairo', sans-serif" font-size="13" font-weight="500" text-anchor="middle">
    تصميم كريم محمود • Medical Social Media Designer
  </text>
</svg>
