<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="audioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#19102e"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="audioGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#audioBg)"/>

  <!-- Soundwave circles pulsating -->
  <g opacity="0.25" stroke="url(#waveGrad)" stroke-width="2">
    <circle cx="640" cy="310" r="280" fill="none" stroke-dasharray="10 8"/>
    <circle cx="640" cy="310" r="210" fill="none"/>
    <circle cx="640" cy="310" r="140" fill="none" stroke-dasharray="6 6"/>
  </g>

  <!-- Equalizer Bars Left and Right -->
  <g fill="url(#waveGrad)" opacity="0.85">
    <!-- Left Bars -->
    <rect x="260" y="270" width="10" height="80" rx="5"/>
    <rect x="290" y="230" width="10" height="160" rx="5"/>
    <rect x="320" y="200" width="10" height="220" rx="5"/>
    <rect x="350" y="250" width="10" height="120" rx="5"/>
    <rect x="380" y="220" width="10" height="180" rx="5"/>
    <rect x="410" y="270" width="10" height="80" rx="5"/>
    <rect x="440" y="240" width="10" height="140" rx="5"/>

    <!-- Right Bars -->
    <rect x="830" y="240" width="10" height="140" rx="5"/>
    <rect x="860" y="270" width="10" height="80" rx="5"/>
    <rect x="890" y="220" width="10" height="180" rx="5"/>
    <rect x="920" y="250" width="10" height="120" rx="5"/>
    <rect x="950" y="200" width="10" height="220" rx="5"/>
    <rect x="980" y="230" width="10" height="160" rx="5"/>
    <rect x="1010" y="270" width="10" height="80" rx="5"/>
  </g>

  <!-- Studio Microphone Illustration Center -->
  <g transform="translate(640, 270)" filter="url(#audioGlow)">
    <!-- Mic capsule background -->
    <rect x="-35" y="-70" width="70" height="110" rx="35" fill="url(#micGrad)"/>
    <!-- Mic grille lines -->
    <line x1="-25" y1="-45" x2="25" y2="-45" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>
    <line x1="-30" y1="-30" x2="30" y2="-30" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>
    <line x1="-32" y1="-15" x2="32" y2="-15" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>
    <line x1="-25" y1="15" x2="25" y2="15" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>

    <!-- Mic Holder Frame / Cradle -->
    <path d="M -50 -10 C -50 55, 50 55, 50 -10" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="55" x2="0" y2="105" stroke="#e2e8f0" stroke-width="6"/>
    <line x1="-40" y1="105" x2="40" y2="105" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Audio Waveform Graphic under Mic -->
  <path d="M 200 480 Q 320 440 440 480 T 640 480 T 840 480 T 1080 480" fill="none" stroke="url(#waveGrad)" stroke-width="3" opacity="0.7"/>

  <!-- Top Badges -->
  <rect x="70" y="50" width="330" height="46" rx="23" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="2"/>
  <text x="235" y="80" fill="#10b981" font-family="'Cairo', sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    🎙️ تعليق صوتي • Voice Over
  </text>

  <rect x="910" y="50" width="300" height="46" rx="23" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="2"/>
  <text x="1060" y="80" fill="#a855f7" font-family="'Cairo', sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    🔊 نبرات وأساليب متعددة
  </text>

  <!-- Bottom Details & Typography -->
  <rect x="0" y="530" width="1280" height="190" fill="linear-gradient(to top, rgba(5,8,17,0.98), transparent)"/>
  
  <text x="640" y="605" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="36" font-weight="800" text-anchor="middle">
    نموذج تعليق صوتي احترافي (Voice Over)
  </text>
  <text x="640" y="655" fill="#38bdf8" font-family="'Cairo', sans-serif" font-size="22" font-weight="600" text-anchor="middle">
    تسجيل صوتي عالي الدقة للنصوص والإعلانات والمحتوى التعليمي بلهجات متعددة
  </text>
</svg>
