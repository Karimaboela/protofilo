<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0e2338"/>
      <stop offset="100%" stop-color="#050b14"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="500" height="500" rx="36" fill="url(#bgGrad)"/>
  
  <!-- Subtle tech grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="0" y1="50" x2="500" y2="500"/>
    <line x1="0" y1="150" x2="500" y2="150"/>
    <line x1="0" y1="250" x2="500" y2="250"/>
    <line x1="0" y1="350" x2="500" y2="350"/>
    <line x1="0" y1="450" x2="500" y2="450"/>
  </g>

  <!-- Ambient glowing rings -->
  <circle cx="250" cy="220" r="160" fill="url(#glowGrad)"/>
  <circle cx="250" cy="220" r="140" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="250" cy="220" r="120" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="3"/>

  <!-- Stylish creative stylized portrait silhouette / avatar icon -->
  <g transform="translate(250, 220)">
    <!-- Shoulders / Torso -->
    <path d="M-75 105 C-75 60, -45 45, 0 45 C45 45, 75 60, 75 105 Z" fill="url(#primaryGrad)" opacity="0.85"/>
    <path d="M-65 105 C-65 68, -40 55, 0 55 C40 55, 65 68, 65 105 Z" fill="#0f172a"/>
    <!-- Head / Face -->
    <circle cx="0" cy="-25" r="48" fill="#e2e8f0"/>
    <!-- Hair / Styling -->
    <path d="M-48 -35 C-48 -75, -20 -82, 0 -82 C20 -82, 48 -75, 48 -35 C38 -45, 10 -48, -25 -42 Z" fill="#1e293b"/>
    <!-- Sleek Studio Glasses / Tech visor motif -->
    <rect x="-38" y="-35" width="32" height="18" rx="6" fill="#0284c7" opacity="0.9"/>
    <rect x="6" y="-35" width="32" height="18" rx="6" fill="#0284c7" opacity="0.9"/>
    <line x1="-6" y1="-26" x2="6" y2="-26" stroke="#0284c7" stroke-width="3"/>
    <!-- Creative Camera / AI Sparkle Badges -->
    <circle cx="38" cy="-55" r="12" fill="#06b6d4" filter="url(#glow)"/>
    <path d="M38 -62 L40 -57 L45 -55 L40 -53 L38 -48 L36 -53 L31 -55 L36 -57 Z" fill="#ffffff"/>
  </g>

  <!-- Bottom Badge: Karim Mahmoud AI & Medical Design -->
  <g transform="translate(250, 415)">
    <rect x="-170" y="-24" width="340" height="48" rx="24" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="6" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">
      KARIM MAHMOUD • AI &amp; MEDIA
    </text>
  </g>
</svg>
