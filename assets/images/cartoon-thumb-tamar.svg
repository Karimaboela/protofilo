<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="tamarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0a2e"/>
      <stop offset="50%" stop-color="#3b1554"/>
      <stop offset="100%" stop-color="#0e0416"/>
    </linearGradient>
    <linearGradient id="tamarSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="tamarRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="playBtnTamar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="softGlowTamar" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#tamarBg)"/>

  <!-- Floral & Islamic stars pattern -->
  <g opacity="0.2" stroke="#e879f9" stroke-width="1.5">
    <circle cx="640" cy="360" r="320" fill="none" stroke-dasharray="12 8"/>
    <circle cx="640" cy="360" r="230" fill="none"/>
    <polygon points="640,90 870,360 640,630 410,360" fill="none" stroke-width="2"/>
  </g>

  <!-- Cute decorative stars and sparkles -->
  <g fill="#fbcfe8" opacity="0.6">
    <circle cx="200" cy="220" r="8"/>
    <circle cx="260" cy="180" r="5"/>
    <circle cx="1080" cy="220" r="8"/>
    <circle cx="1020" cy="180" r="6"/>
  </g>

  <!-- Character Avatar Illustration: تمار (Girl Character with cute Hijab/Scarf) -->
  <g transform="translate(640, 290)">
    <!-- Aura -->
    <circle cx="0" cy="0" r="145" fill="url(#tamarSun)" opacity="0.25" filter="url(#softGlowTamar)"/>
    <circle cx="0" cy="0" r="120" fill="#1e102d" stroke="#e879f9" stroke-width="4"/>
    
    <!-- Hijab / Dress -->
    <path d="M -70 95 Q 0 80 70 95 L 85 120 L -85 120 Z" fill="#c084fc"/>
    <path d="M -50 95 Q 0 85 50 95 L 60 120 L -60 120 Z" fill="#fdf2f8"/>

    <!-- Head / Scarf Hood -->
    <ellipse cx="0" cy="10" rx="60" ry="65" fill="#f472b6"/>

    <!-- Inner Face Cutout -->
    <ellipse cx="0" cy="14" rx="44" ry="48" fill="#fed7aa"/>

    <!-- Cheeks blush -->
    <circle cx="-25" cy="26" r="9" fill="#f43f5e" opacity="0.55"/>
    <circle cx="25" cy="26" r="9" fill="#f43f5e" opacity="0.55"/>

    <!-- Big gentle eyes with long eyelashes -->
    <ellipse cx="-18" cy="12" rx="8" ry="11" fill="#0f172a"/>
    <circle cx="-16" cy="9" r="4" fill="#ffffff"/>
    <ellipse cx="18" cy="12" rx="8" ry="11" fill="#0f172a"/>
    <circle cx="20" cy="9" r="4" fill="#ffffff"/>
    <!-- Cute smile -->
    <path d="M -15 30 Q 0 44 15 30" fill="none" stroke="#be123c" stroke-width="4" stroke-linecap="round"/>

    <!-- Cute Hijab Flower Accent -->
    <g transform="translate(38, -30)">
      <circle cx="0" cy="0" r="11" fill="#fb7185"/>
      <circle cx="0" cy="0" r="5" fill="#fef08a"/>
    </g>
  </g>

  <!-- Big Play Button Center -->
  <g transform="translate(640, 310)" filter="url(#softGlowTamar)">
    <circle cx="0" cy="0" r="52" fill="url(#playBtnTamar)" opacity="0.95"/>
    <polygon points="-12,-20 22,0 -12,20" fill="#ffffff"/>
  </g>

  <!-- Top Badges -->
  <rect x="70" y="50" width="310" height="46" rx="23" fill="rgba(232,121,249,0.15)" stroke="#e879f9" stroke-width="2"/>
  <text x="225" y="80" fill="#e879f9" font-family="'Cairo', sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    🌸 نصائح كرتونية للفتيات والناشئة
  </text>

  <rect x="910" y="50" width="300" height="46" rx="23" fill="rgba(251,113,133,0.15)" stroke="#fb7185" stroke-width="2"/>
  <text x="1060" y="80" fill="#fb7185" font-family="'Cairo', sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    💖 بر الوالدين وحب الأسرة
  </text>

  <!-- Bottom Details & Typography -->
  <rect x="0" y="530" width="1280" height="190" fill="linear-gradient(to top, rgba(14,4,22,0.98), transparent)"/>
  
  <text x="640" y="605" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="36" font-weight="800" text-anchor="middle">
    نصائح كرتونية: بر الوالدين والتعاون الأسري في البيت
  </text>
  <text x="640" y="655" fill="#f472b6" font-family="'Cairo', sans-serif" font-size="22" font-weight="600" text-anchor="middle">
    حلقة كرتونية قصيرة لتعليم أسرار إدخال السرور على قلوب الآباء والأمهات
  </text>
</svg>
