<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="aliBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04202c"/>
      <stop offset="50%" stop-color="#0c3a40"/>
      <stop offset="100%" stop-color="#02141a"/>
    </linearGradient>
    <linearGradient id="aliSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="playBtnAli" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="softGlowAli" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#aliBg)"/>

  <!-- Mosque Silhouette & Arch in Background -->
  <g opacity="0.16" stroke="#2dd4bf" stroke-width="1.5">
    <circle cx="640" cy="360" r="320" fill="none" stroke-dasharray="14 10"/>
    <path d="M 520 450 C 520 300, 760 300, 760 450" fill="none" stroke-width="2"/>
    <polygon points="640,60 880,360 640,660 400,360" fill="none"/>
  </g>

  <!-- Crescent and Star -->
  <g transform="translate(640, 130)" opacity="0.45" fill="#2dd4bf">
    <path d="M -15,-20 A 25,25 0 1 0 20,20 A 20,20 0 1 1 -15,-20 Z"/>
    <polygon points="25,-5 28,-1 33,-1 29,2 30,7 26,4 21,7 23,2 19,-1 24,-1"/>
  </g>

  <!-- Character Avatar Illustration: علي (Boy Character with neat Prayer Kufi/Cap) -->
  <g transform="translate(640, 290)">
    <!-- Aura -->
    <circle cx="0" cy="0" r="145" fill="url(#aliSun)" opacity="0.25" filter="url(#softGlowAli)"/>
    <circle cx="0" cy="0" r="120" fill="#04202c" stroke="#2dd4bf" stroke-width="4"/>
    
    <!-- Shoulders / Thobe -->
    <path d="M -70 100 Q 0 85 70 100 L 80 120 L -80 120 Z" fill="#0f766e"/>
    <path d="M -50 100 Q 0 90 50 100 L 60 120 L -60 120 Z" fill="#ffffff"/>

    <!-- Head / Face -->
    <circle cx="0" cy="10" r="55" fill="#fed7aa"/>
    
    <!-- Cute prayer cap / Kufi -->
    <path d="M -52 0 C -52 -50, 52 -50, 52 0 Z" fill="#ffffff" stroke="#2dd4bf" stroke-width="2"/>
    <path d="M -48 -2 C -48 -35, 48 -35, 48 -2" fill="none" stroke="#99f6e4" stroke-width="2" stroke-dasharray="5 3"/>

    <!-- Cheeks blush -->
    <circle cx="-30" cy="24" r="9" fill="#f43f5e" opacity="0.5"/>
    <circle cx="30" cy="24" r="9" fill="#f43f5e" opacity="0.5"/>

    <!-- Cheerful big eyes -->
    <ellipse cx="-20" cy="12" rx="9" ry="12" fill="#0f172a"/>
    <circle cx="-18" cy="9" r="4" fill="#ffffff"/>
    <ellipse cx="20" cy="12" rx="9" ry="12" fill="#0f172a"/>
    <circle cx="22" cy="9" r="4" fill="#ffffff"/>
    <!-- Joyful smile -->
    <path d="M -16 28 Q 0 44 16 28" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Big Play Button Center -->
  <g transform="translate(640, 310)" filter="url(#softGlowAli)">
    <circle cx="0" cy="0" r="52" fill="url(#playBtnAli)" opacity="0.95"/>
    <polygon points="-12,-20 22,0 -12,20" fill="#ffffff"/>
  </g>

  <!-- Top Badges -->
  <rect x="70" y="50" width="310" height="46" rx="23" fill="rgba(45,212,191,0.15)" stroke="#2dd4bf" stroke-width="2"/>
  <text x="225" y="80" fill="#2dd4bf" font-family="'Cairo', sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    🕌 نصائح كرتون • عبادات وأخلاق
  </text>

  <rect x="910" y="50" width="300" height="46" rx="23" fill="rgba(45,212,191,0.15)" stroke="#2dd4bf" stroke-width="2"/>
  <text x="1060" y="80" fill="#2dd4bf" font-family="'Cairo', sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    ✨ صلاة الجماعة وحسن الخلق
  </text>

  <!-- Bottom Details & Typography -->
  <rect x="0" y="530" width="1280" height="190" fill="linear-gradient(to top, rgba(2,20,26,0.98), transparent)"/>
  
  <text x="640" y="605" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="36" font-weight="800" text-anchor="middle">
    نصائح كرتونية: المحافظة على صلاة الجماعة وبركة الوقت
  </text>
  <text x="640" y="655" fill="#2dd4bf" font-family="'Cairo', sans-serif" font-size="22" font-weight="600" text-anchor="middle">
    موقف كرتوني تربوي رائع يتعلم منه الأطفال فضل الصلاة في وقتها وبناء العادات الصالحة
  </text>
</svg>
