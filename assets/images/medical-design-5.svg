<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24"/>
      <stop offset="50%" stop-color="#141a38"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="purpleCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="purpleGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#aiBg)"/>

  <!-- Neural Net nodes background -->
  <g opacity="0.2" stroke="#8b5cf6" stroke-width="1.5">
    <line x1="100" y1="200" x2="250" y2="300"/>
    <line x1="250" y1="300" x2="350" y2="180"/>
    <line x1="350" y1="180" x2="500" y2="280"/>
    <line x1="500" y1="280" x2="680" y2="200"/>
    <line x1="250" y1="300" x2="400" y2="400"/>
    <line x1="400" y1="400" x2="550" y2="380"/>
  </g>

  <!-- Tag Pill -->
  <rect x="60" y="50" width="220" height="36" rx="18" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="170" y="74" fill="#a78bfa" font-family="'Cairo', sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    AI VISUALS • ذكاء اصطناعي طبي
  </text>
  <text x="740" y="75" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="14" font-weight="600" text-anchor="end">
    سرد بصري سينمائي
  </text>

  <!-- Central Visual: Neural Brain & Medical Cross Intersection -->
  <g transform="translate(400, 330)">
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#purpleCyan)" stroke-width="2" stroke-dasharray="10 8" opacity="0.6"/>
    <circle cx="0" cy="0" r="120" fill="rgba(139,92,246,0.06)"/>

    <!-- Glowing stylized brain & AI pulse -->
    <path d="M-60,-20 C-80,-60 -30,-90 0,-70 C30,-90 80,-60 60,-20 C80,30 30,70 0,65 C-30,70 -80,30 -60,-20 Z" 
          fill="none" stroke="url(#purpleCyan)" stroke-width="4" filter="url(#purpleGlow)"/>

    <!-- Medical Plus Symbol in Center -->
    <rect x="-10" y="-35" width="20" height="70" rx="6" fill="#00f2fe" filter="url(#purpleGlow)"/>
    <rect x="-35" y="-10" width="70" height="20" rx="6" fill="#00f2fe" filter="url(#purpleGlow)"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="400" y="560" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="40" font-weight="800" text-anchor="middle">
    تجسيد المفاهيم الطبية بتقنيات الـ AI
  </text>
  <text x="400" y="610" fill="#a78bfa" font-family="'Cairo', sans-serif" font-size="22" font-weight="600" text-anchor="middle">
    تحويل المصطلحات الطبية المعقدة إلى قصص بصرية ممتعة
  </text>

  <!-- Badges -->
  <g transform="translate(400, 680)">
    <rect x="-250" y="-22" width="500" height="44" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(139,92,246,0.3)"/>
    <text x="0" y="7" fill="#ede9fe" font-family="'Cairo', sans-serif" font-size="16" font-weight="600" text-anchor="middle">
      Generative AI • 3D Medical Render • Visual Storytelling
    </text>
  </g>

  <text x="400" y="760" fill="#64748b" font-family="'Cairo', sans-serif" font-size="13" font-weight="500" text-anchor="middle">
    تصميم كريم محمود • AI Video Specialist &amp; Designer
  </text>
</svg>
