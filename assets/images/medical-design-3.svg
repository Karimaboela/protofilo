<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="surgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c1e"/>
      <stop offset="50%" stop-color="#00363a"/>
      <stop offset="100%" stop-color="#001214"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="emeraldGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#surgBg)"/>

  <!-- High Tech Medical Geometric Grid Lines -->
  <g opacity="0.1" stroke="#10b981" stroke-width="1.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="700" x2="800" y2="700"/>
    <line x1="150" y1="0" x2="150" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="650" y1="0" x2="650" y2="800"/>
  </g>

  <circle cx="400" cy="340" r="210" fill="url(#emeraldGrad)" opacity="0.12" filter="url(#emeraldGlow)"/>

  <!-- Header badges -->
  <rect x="60" y="50" width="200" height="36" rx="18" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="1.5"/>
  <text x="160" y="74" fill="#34d399" font-family="'Cairo', sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    SURGERY • جراحة المناظير
  </text>
  <text x="740" y="75" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="14" font-weight="600" text-anchor="end">
    محتوى طبي عالي الدقة
  </text>

  <!-- Central Surgical Tech Hologram -->
  <g transform="translate(400, 330)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#emeraldGrad)" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="110" fill="rgba(6,182,212,0.06)"/>

    <!-- Crosshair & Precision HUD -->
    <line x1="-160" y1="0" x2="-120" y2="0" stroke="#10b981" stroke-width="2"/>
    <line x1="120" y1="0" x2="160" y2="0" stroke="#10b981" stroke-width="2"/>
    <line x1="0" y1="-160" x2="0" y2="-120" stroke="#10b981" stroke-width="2"/>
    <line x1="0" y1="120" x2="0" y2="160" stroke="#10b981" stroke-width="2"/>

    <!-- High-tech 4K Laparoscope & Target Graphic -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#10b981" stroke-width="3" filter="url(#emeraldGlow)"/>
    <circle cx="0" cy="0" r="20" fill="url(#emeraldGrad)"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>

    <path d="M-80,-70 L-30,-30" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4 4"/>
    <text x="-90" y="-75" fill="#34d399" font-family="'Cairo', sans-serif" font-size="13" font-weight="700" text-anchor="end">4K ULTRA HD</text>

    <path d="M80,70 L30,30" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="4 4"/>
    <text x="90" y="75" fill="#06b6d4" font-family="'Cairo', sans-serif" font-size="13" font-weight="700" text-anchor="start">MINIMAL INVASIVE</text>
  </g>

  <!-- Titles -->
  <text x="400" y="560" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="40" font-weight="800" text-anchor="middle">
    جراحات المناظير المتقدمة بأعلى دقة
  </text>
  <text x="400" y="610" fill="#34d399" font-family="'Cairo', sans-serif" font-size="22" font-weight="600" text-anchor="middle">
    أمان فائق، تعافي أسرع وبأقل تدخل جراحي
  </text>

  <!-- 3 Stats -->
  <g transform="translate(400, 680)">
    <g transform="translate(-200, 0)">
      <text x="0" y="-5" fill="#34d399" font-family="'Cairo', sans-serif" font-size="24" font-weight="800" text-anchor="middle">24 ساعة</text>
      <text x="0" y="20" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="13" font-weight="500" text-anchor="middle">للخروج من المستشفى</text>
    </g>
    <g transform="translate(0, 0)">
      <text x="0" y="-5" fill="#38bdf8" font-family="'Cairo', sans-serif" font-size="24" font-weight="800" text-anchor="middle">99.8%</text>
      <text x="0" y="20" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="13" font-weight="500" text-anchor="middle">نسب نجاح معتمدة</text>
    </g>
    <g transform="translate(200, 0)">
      <text x="0" y="-5" fill="#34d399" font-family="'Cairo', sans-serif" font-size="24" font-weight="800" text-anchor="middle">0 ندوب</text>
      <text x="0" y="20" fill="#94a3b8" font-family="'Cairo', sans-serif" font-size="13" font-weight="500" text-anchor="middle">أثر تجميلي مثالي</text>
    </g>
  </g>

  <text x="400" y="760" fill="#64748b" font-family="'Cairo', sans-serif" font-size="13" font-weight="500" text-anchor="middle">
    تصميم كريم محمود • Medical Social Media Designer
  </text>
</svg>
